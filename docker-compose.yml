services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?set FLASK_SECRET_KEY}
      MAIL_SETTINGS_ENCRYPTION_KEY: ${MAIL_SETTINGS_ENCRYPTION_KEY:?set MAIL_SETTINGS_ENCRYPTION_KEY}
      DATABASE_URL: postgresql+psycopg://mailflow:${POSTGRES_PASSWORD:-change-me-in-local-env}@postgres:5432/mailflow
      COOKIE_SECURE: "0"
    command: >-
      sh -c "flask --app app db upgrade && exec gunicorn --bind 0.0.0.0:5000 app:app"
    ports:
      - "5000:5000"
    volumes:
      - app_instance:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build: .
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?set FLASK_SECRET_KEY}
      MAIL_SETTINGS_ENCRYPTION_KEY: ${MAIL_SETTINGS_ENCRYPTION_KEY:?set MAIL_SETTINGS_ENCRYPTION_KEY}
      DATABASE_URL: postgresql+psycopg://mailflow:${POSTGRES_PASSWORD:-change-me-in-local-env}@postgres:5432/mailflow
      COOKIE_SECURE: "0"
    command: ["python", "app.py", "--scheduler"]
    volumes:
      - app_instance:/app/instance
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  app_instance:
